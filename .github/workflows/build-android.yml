name: Build Android APK (Native Gradle)

# APK di Celebra e prega facile (package it.messaparroco.prega).
# Gradle diretto, senza EAS. Artifact scaricabile dalla pagina Actions.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # JDK via apt: evita setup-java quando codeload.github.com è instabile
      # (errore "Failed to download archive ... setup-java/tar.gz").
      - name: Setup Java JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          java -version

      # SDK via sdkmanager: evita setup-android quando codeload.github.com è instabile.
      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do echo y; done | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --list_installed | head -20

      - name: Install dependencies
        working-directory: ./frontend
        # NOTA: NON usiamo --frozen-lockfile perché il workflow di
        # "Save to GitHub" di Emergent a volte non include yarn.lock
        # nel commit (specialmente quando viene aggiornato in seguito a
        # yarn add/remove). Con yarn install standard, in caso di
        # disallineamento minore, yarn aggiorna il lock e prosegue.
        run: yarn install --network-timeout 600000

      - name: Generate debug keystore for signing (sideload-friendly)
        run: |
          mkdir -p $HOME/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore $HOME/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Stamp APK version and production date
        working-directory: ./frontend
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = "app.json";
          const j = JSON.parse(fs.readFileSync(path, "utf8"));
          const n = Number(process.env.GITHUB_RUN_NUMBER || "1");
          const date = new Intl.DateTimeFormat("it-IT", {
            timeZone: "Europe/Rome",
            day: "2-digit",
            month: "2-digit",
            year: "2-digit",
          }).format(new Date());
          j.expo.version = `1.0.${n}`;
          j.expo.android = j.expo.android || {};
          j.expo.android.versionCode = n;
          j.expo.extra = j.expo.extra || {};
          j.expo.extra.apkDate = date;
          fs.writeFileSync(path, JSON.stringify(j, null, 2) + "\n");
          console.log(`APK version 1.0.${n} · ${date}`);
          EOF

      - name: Expo prebuild (genera progetto Android nativo)
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*') }}

      - name: Make gradlew executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Release APK (firmato con debug keystore)
        working-directory: ./frontend/android
        env:
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g"
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: celebra-prega-facile-v${{ github.run_number }}-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30
