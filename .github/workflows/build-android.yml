name: Build Android APK (Native Gradle)

# APK di Celebra e prega facile (package it.messaparroco.prega).
# Gradle diretto, senza EAS. Artifact + Release GitHub (per aggiornamento in-app).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Java JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          java -version

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in $(seq 1 100); do echo y; done | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --list_installed | head -20

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --network-timeout 600000

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/signing"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/signing/release.keystore"
            echo "SIGN_STORE_FILE=$HOME/signing/release.keystore" >> "$GITHUB_ENV"
            echo "SIGN_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using RELEASE keystore from secrets (in-app updates OK)."
          else
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "SIGN_STORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
            echo "SIGN_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGN_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "SIGN_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "::warning::No release keystore secrets — signed with debug keystore. In-app update requires fixed secrets."
          fi

      - name: Stamp APK version and production date
        working-directory: ./frontend
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = "app.json";
          const j = JSON.parse(fs.readFileSync(path, "utf8"));
          const n = Number(process.env.GITHUB_RUN_NUMBER || "1");
          const date = new Intl.DateTimeFormat("it-IT", {
            timeZone: "Europe/Rome",
            day: "2-digit",
            month: "2-digit",
            year: "2-digit",
          }).format(new Date());
          j.expo.version = `1.0.${n}`;
          j.expo.android = j.expo.android || {};
          j.expo.android.versionCode = n;
          j.expo.extra = j.expo.extra || {};
          j.expo.extra.apkDate = date;
          j.expo.extra.githubRepo = j.expo.extra.githubRepo || "piccolin1971-eng/celebra-facile-AS";
          fs.writeFileSync(path, JSON.stringify(j, null, 2) + "\n");
          console.log(`APK version 1.0.${n} · ${date}`);
          fs.writeFileSync(
            "version.json",
            JSON.stringify(
              {
                versionCode: n,
                versionName: `1.0.${n}`,
                apkDate: date,
              },
              null,
              2,
            ) + "\n",
          );
          EOF

      - name: Expo prebuild (genera progetto Android nativo)
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*') }}

      - name: Make gradlew executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: ./frontend/android
        env:
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g"
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file=$SIGN_STORE_FILE \
            -Pandroid.injected.signing.store.password=$SIGN_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGN_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGN_KEY_PASSWORD \
            --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          DEST="celebra-prega-facile-v${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$DEST"
          echo "apk_named=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: celebra-prega-facile-v${{ github.run_number }}-apk
          path: ${{ steps.locate.outputs.apk_named }}
          retention-days: 30

      - name: Publish GitHub Release (for in-app update)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          cp frontend/version.json ./version.json
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "${{ steps.locate.outputs.apk_named }}" \
            version.json \
            --title "Celebra $TAG" \
            --notes "Build automatica ${TAG} (run ${GITHUB_RUN_NUMBER}). Aggiornamento in-app: scarica l'APK e conferma Installa." \
            --latest
