name: Build Android APK (Native Gradle)

# Costruisce l'APK Android del Messale CEI usando Gradle direttamente
# (NO EAS - evita la quota mensile gratuita).
# L'APK viene caricato come artifact scaricabile dalla pagina Actions.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # JDK via apt: evita setup-java quando codeload.github.com è instabile
      # (errore "Failed to download archive ... setup-java/tar.gz").
      - name: Setup Java JDK 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          java -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./frontend
        # NOTA: NON usiamo --frozen-lockfile perché il workflow di
        # "Save to GitHub" di Emergent a volte non include yarn.lock
        # nel commit (specialmente quando viene aggiornato in seguito a
        # yarn add/remove). Con yarn install standard, in caso di
        # disallineamento minore, yarn aggiorna il lock e prosegue.
        run: yarn install --network-timeout 600000

      - name: Generate debug keystore for signing (sideload-friendly)
        run: |
          mkdir -p $HOME/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore $HOME/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Expo prebuild (genera progetto Android nativo)
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Cache Gradle
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*') }}

      - name: Make gradlew executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Release APK (firmato con debug keystore)
        working-directory: ./frontend/android
        env:
          GRADLE_OPTS: "-Xmx6g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g"
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: messa-cei-v${{ github.run_number }}-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 30
